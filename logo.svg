<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Bambi Nails Studio logo</title>
  <desc id="desc">A round white logo with gold Bambi script, small nails studio text, and soft pink florals.</desc>
  <defs>
    <radialGradient id="paper" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffefd"/>
      <stop offset="0.62" stop-color="#fff9f4"/>
      <stop offset="1" stop-color="#f6eee5"/>
    </radialGradient>
    <linearGradient id="gold" x1="110" x2="600" y1="190" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7cf95"/>
      <stop offset="0.44" stop-color="#b98b3e"/>
      <stop offset="1" stop-color="#f4dfab"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#9b6d43" flood-opacity="0.18"/>
    </filter>
  </defs>
  <circle cx="360" cy="360" r="312" fill="url(#paper)" filter="url(#softShadow)"/>
  <circle cx="360" cy="360" r="282" fill="none" stroke="#f3dce3" stroke-width="7" stroke-dasharray="4 18" opacity="0.7"/>
  <g fill="none" stroke="#dfb3bf" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M151 214c35 20 65 29 104 23"/>
    <path d="M160 201c18 10 36 14 58 11"/>
    <path d="M555 478c-29-17-57-25-92-21"/>
    <path d="M563 491c-17-9-34-13-55-10"/>
  </g>
  <g fill="#f4b5c7" opacity="0.92">
    <ellipse cx="131" cy="246" rx="15" ry="27" transform="rotate(-35 131 246)"/>
    <ellipse cx="161" cy="230" rx="15" ry="27" transform="rotate(24 161 230)"/>
    <ellipse cx="179" cy="259" rx="15" ry="27" transform="rotate(86 179 259)"/>
    <circle cx="158" cy="250" r="9" fill="#d8a452"/>
    <ellipse cx="577" cy="450" rx="15" ry="27" transform="rotate(145 577 450)"/>
    <ellipse cx="548" cy="468" rx="15" ry="27" transform="rotate(-154 548 468)"/>
    <ellipse cx="527" cy="440" rx="15" ry="27" transform="rotate(-96 527 440)"/>
    <circle cx="548" cy="448" r="9" fill="#d8a452"/>
  </g>
  <text
    x="360"
    y="372"
    text-anchor="middle"
    fill="url(#gold)"
    font-family="Brush Script MT, Segoe Script, cursive"
    font-size="150"
    font-weight="400"
    letter-spacing="-8"
  >Bambi</text>
  <text
    x="360"
    y="424"
    text-anchor="middle"
    fill="#8b6b46"
    font-family="DM Sans, Arial, sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="8"
  >NAILS STUDIO</text>
  <text
    x="360"
    y="479"
    text-anchor="middle"
    fill="#c57a94"
    font-family="DM Sans, Arial, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="4"
  >@BAMBI_NAILSSSS</text>
</svg>
